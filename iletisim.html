<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b16" />
    <meta name="description" content="ASE Group iletişim. Keşif ve teklif için yazın." />
    <title>İletişim — ASE Group</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <div id="preloader"><div><img class="pre-logo" src="assets/logo-on-dark.png" alt="ASE Group" /><div class="pre-bar"><span></span></div></div></div>
    <div class="cursor" id="cursor"></div>
    <div id="nav-root"></div>
    <main>
      <section class="page-hero">
        <img class="bg" src="assets/img/city.jpg" alt="" />
        <div class="container">
          <p class="kicker" data-i18n="contact_k"></p>
          <h1 data-i18n="contact_t"></h1>
        </div>
      </section>
      <section class="section">
        <div class="container detail-grid">
          <div class="contact-side">
            <p data-i18n="contact_d"></p>
            <p><span class="gold" data-i18n="mail_label">E-posta</span><br /><a href="mailto:info@asegroup.com.tr">info@asegroup.com.tr</a></p>
            <p><span class="gold" data-i18n="web_label">Web</span><br />asegroup.com.tr</p>
          </div>
          <form class="form" id="contact-form">
            <div class="form-row">
              <label><span data-i18n="f_name">Ad soyad</span><input name="name" required /></label>
              <label><span data-i18n="f_mail">E-posta</span><input name="email" type="email" required /></label>
            </div>
            <div class="form-row">
              <label><span data-i18n="f_phone">Telefon</span><input name="phone" /></label>
              <label>
                <span data-i18n="f_topic">Konu</span>
                <select name="topic">
                  <option data-i18n="opt_yapi" value="yapi">Yapı</option>
                  <option data-i18n="opt_trade" value="ticaret">İthalat / İhracat</option>
                  <option data-i18n="opt_energy" value="enerji">Şarj / Araç elektrik</option>
                  <option data-i18n="opt_reno" value="tadilat">Tadilat</option>
                  <option data-i18n="opt_survey" value="kesif">Keşif</option>
                </select>
              </label>
            </div>
            <label><span data-i18n="f_msg">Mesaj</span><textarea name="message" required></textarea></label>
            <button class="btn btn-solid" type="submit" data-i18n="f_send">Gönder</button>
            <p class="form-ok" id="form-ok" data-i18n="f_ok"></p>
          </form>
        </div>
      </section>
    </main>
    <div id="footer-root"></div>
    <script src="js/i18n.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
