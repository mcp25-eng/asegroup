<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b16" />
    <meta
      name="description"
      content="ASE Group — Sitemiz yakında aktif olacaktır. Our website will be active soon."
    />
    <title>ASE Group — Yakında / Coming Soon</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="page">
      <header class="brand-mark">
        <span>ASE GROUP</span>
        <span class="dot"></span>
        <span>asegroup.com.tr</span>
      </header>

      <main class="stage">
        <div class="rig" id="rig">
          <div class="orbit orbit-a"></div>
          <div class="orbit orbit-b"></div>
          <div class="orbit orbit-c"></div>

          <article class="card">
            <div class="card-glow"></div>
            <img
              class="logo"
              src="assets/logo.png"
              alt="ASE Group"
              width="263"
              height="107"
            />
            <div class="rule" aria-hidden="true">
              <span></span>
              <i></i>
              <span></span>
            </div>
            <p class="msg tr">Sitemiz yakında aktif olacaktır</p>
            <p class="msg en">Our website will be active soon</p>
          </article>
        </div>
      </main>

      <footer>
        <p>© 2026 ASE Group · asegroup.com.tr</p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
    <script src="js/scene.js"></script>
  </body>
</html>
